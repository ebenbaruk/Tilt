name: api

on:
  pull_request:
    paths: ["apps/api/**", "apps/mod/hooks/protocol.ts", "packages/contract/**", ".github/workflows/api.yml", "pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "apps/mod/hooks/protocol.ts", "packages/contract/**", ".github/workflows/api.yml", "pnpm-lock.yaml"]

permissions:
  contents: read

jobs:
  test:
    name: typecheck, tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tilt
          POSTGRES_DB: tilt_api_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:tilt@localhost:5432/tilt_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tilt/api typecheck
      - run: pnpm --filter @tilt/api test
