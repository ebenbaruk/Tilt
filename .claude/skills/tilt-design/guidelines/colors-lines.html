<!-- @dsCard group="Colors" viewport="700x150" subtitle="Border ramp for dividers and controls" name="Lines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-terminal);color:var(--text-body);font-family:var(--font-mono);font-size:var(--text-base);line-height:var(--leading-body);">
<div style="padding:20px 24px;"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;"><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--line-1);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">divider</span><span style="color:var(--fg-6);font-size:11px;">--line-1</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--line-2);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">input</span><span style="color:var(--fg-6);font-size:11px;">--line-2</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--line-3);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">control</span><span style="color:var(--fg-6);font-size:11px;">--line-3</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--line-4);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">hidden</span><span style="color:var(--fg-6);font-size:11px;">--line-4</span></div></div></div></body></html>
