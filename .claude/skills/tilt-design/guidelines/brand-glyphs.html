<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-terminal);color:var(--text-body);font-family:var(--font-mono);font-size:var(--text-base);line-height:var(--leading-body);">
<div style="padding:20px 24px;"><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;"><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--tilt-green);">●</span><span style="font-size:11px;color:var(--fg-6);">tool call</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-5);">└</span><span style="font-size:11px;color:var(--fg-6);">output</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--tilt-green);">✓</span><span style="font-size:11px;color:var(--fg-6);">done</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--tilt-gold);">★</span><span style="font-size:11px;color:var(--fg-6);">win</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-6);">›</span><span style="font-size:11px;color:var(--fg-6);">prompt</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-4);">·</span><span style="font-size:11px;color:var(--fg-6);">separator</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-1);">♠</span><span style="font-size:11px;color:var(--fg-6);">spade</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--tilt-red);">♥</span><span style="font-size:11px;color:var(--fg-6);">heart</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-4);">▸</span><span style="font-size:11px;color:var(--fg-6);">expand</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-6);">▲</span><span style="font-size:11px;color:var(--fg-6);">ball</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-1);">⏎</span><span style="font-size:11px;color:var(--fg-6);">return</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-size:22px;color:var(--fg-4);">↺</span><span style="font-size:11px;color:var(--fg-6);">replay</span></div></div></div></body></html>
