<!-- @dsCard group="Colors" viewport="700x150" subtitle="Pink = brand, gold = money, green = agent, red = loss" name="Accents" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-terminal);color:var(--text-body);font-family:var(--font-mono);font-size:var(--text-base);line-height:var(--leading-body);">
<div style="padding:20px 24px;"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;"><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--tilt-pink);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">brand</span><span style="color:var(--fg-6);font-size:11px;">--tilt-pink</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--tilt-gold);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">money</span><span style="color:var(--fg-6);font-size:11px;">--tilt-gold</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--tilt-green);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">agent</span><span style="color:var(--fg-6);font-size:11px;">--tilt-green</span></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:var(--radius-sm);background:var(--tilt-red);border:1px solid var(--line-1);"></div><span style="color:var(--fg-1);font-size:12px;">loss</span><span style="color:var(--fg-6);font-size:11px;">--tilt-red</span></div></div></div></body></html>
