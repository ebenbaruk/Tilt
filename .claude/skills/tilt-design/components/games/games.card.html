<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../scripts/load-components.js"></script></head>
<body style="margin:0;background:var(--surface-terminal);color:var(--text-body);font-family:var(--font-mono);font-size:var(--text-base);line-height:var(--leading-body);">
<div id="root"></div>
<script type="text/babel">
getTilt('../../').then(NS => {
const { Hand, RouletteStrip, SlotMachine } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ padding: 20, display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: 20 }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <Hand label="DEALER" total="10 + ?" cards={[{rank:'K',suit:'♣'},{hidden:true}]} />
      <Hand label="YOU" total={20} meta="bet 500" cards={[{rank:'A',suit:'♥'},{rank:'9',suit:'♠'}]} />
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <RouletteStrip value={17} reach={2} />
      <SlotMachine symbols={['7','★','7']} />
    </div>
  </div>);
});
</script></body></html>
